name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e packages/shared          # recruiter_shared (+ pyjwt)
          python -m spacy download en_core_web_sm  # Tier-1 parser model

      - name: Run tests
        run: pytest tests/ -q

  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # Build-time placeholders; real values are injected at runtime/deploy.
          BACKEND_URL: http://127.0.0.1:8000
          ADMIN_API_TOKEN: ci-placeholder-token
          NEXT_PUBLIC_VOICE_URL: http://127.0.0.1:7860

  shared:
    name: Shared package (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install & test
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/shared pytest
          pytest packages/shared/tests -q
