# Alembic configuration for the AI-Recruiter voice-agent goal-tracking database.
# The database URL is built at runtime from DB_* environment variables in alembic/env.py
# (loaded from .env), so it is intentionally not hard-coded here.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# Use a zero-padded, descriptive revision filename, e.g. 0001_initial_schema.py
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
