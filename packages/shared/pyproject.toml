[project]
name = "recruiter-shared"
version = "0.1.0"
description = "Shared utilities for AI-Recruiter (role slugs, statuses, interview-link tokens)"
requires-python = ">=3.11"
dependencies = [
    "pyjwt>=2.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recruiter_shared"]
